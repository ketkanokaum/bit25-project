services:
  - type: web
    name: bit25-model-api
    runtime: python
    plan: free
    rootDir: model-api
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
